<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wahana Cafe Baler • Cabin & Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #15291b; color: #f4efe6; }
    h1, h2, h3, .font-heading { font-family: 'Fredoka', cursive; }
    .bg-forest { background-color: #1e3a27; }
    .bg-dark-forest { background-color: #15291b; }
    .bg-cream { background-color: #f4efe6; }
    .text-cream { color: #f4efe6; }
    .text-forest { color: #1e3a27; }
    .glow-title { text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3); }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-forest border-b border-white/10 sticky top-0 z-40 shadow-xl">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex flex-col">
        <h1 class="text-2xl font-extrabold font-heading text-amber-400 tracking-wide glow-title flex items-center gap-2">
          ☕ WAHANA CAFE BALER
        </h1>
        <p class="text-[11px] text-amber-200/80 font-medium tracking-wider uppercase">Cabin + Cafe • Real-Time Kitchen Connection</p>
      </div>
      <button onclick="toggleCartModal()" id="cart-nav-btn" class="relative bg-amber-500 hover:bg-amber-400 text-black px-5 py-2.5 rounded-full font-bold flex items-center gap-2 shadow-lg transition">
        🛒 Order Cart
        <span id="cart-badge" class="bg-black text-amber-300 text-xs px-2 py-0.5 rounded-full font-mono hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Banner & Status Bar -->
  <section class="max-w-4xl mx-auto px-4 mt-6">
    <div id="store-status-banner" class="p-4 rounded-2xl bg-forest border border-white/10 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <span id="store-status-indicator" class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="store-status-text" class="font-bold text-sm text-cream">Accepting Orders Now</span>
      </div>
      <span class="text-xs text-amber-200/70 font-mono">Baler, Aurora</span>
    </div>
  </section>

  <!-- Track Active Order Card -->
  <section id="active-order-section" class="max-w-4xl mx-auto px-4 mt-6 hidden">
    <div class="bg-forest border-2 border-amber-500/40 rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-xs font-mono uppercase bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-md">Live Order Tracker</span>
          <h2 class="text-lg font-bold font-heading mt-1">Order #<span id="track-order-id">---</span></h2>
          <p class="text-xs text-white/60 mt-0.5" id="track-customer-details">Loading details...</p>
        </div>
        <div class="flex items-center gap-2">
          <span id="track-status-badge" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-black tracking-wide shadow-sm">Pending Review</span>
        </div>
      </div>

      <!-- Tracker Stepper -->
      <div id="tracker-stepper-container" class="relative flex items-center justify-between mt-6 px-4">
        <div class="absolute left-8 right-8 top-1/2 -translate-y-1/2 h-1 bg-white/10 -z-0"></div>
        <div id="track-line-progress" class="absolute left-8 top-1/2 -translate-y-1/2 h-1 bg-amber-500 transition-all duration-500 -z-0" style="width: 0%;"></div>

        <div class="relative z-10 flex flex-col items-center">
          <div id="step-1-circle" class="w-8 h-8 rounded-full bg-amber-500 text-black font-bold flex items-center justify-center text-xs">1</div>
          <span id="step-1-label" class="text-[10px] mt-2 text-amber-300 font-bold text-center">Waiting for Kitchen to Accept</span>
        </div>
        <div class="relative z-10 flex flex-col items-center">
          <div id="step-2-circle" class="w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs">2</div>
          <span class="text-[10px] mt-2 text-white/70 font-bold">Preparing</span>
        </div>
        <div class="relative z-10 flex flex-col items-center">
          <div id="step-3-circle" class="w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs">3</div>
          <span id="step-3-label" class="text-[10px] mt-2 text-white/50 font-bold text-center">Ready</span>
        </div>
      </div>

      <!-- Cancel Order Action (Available while Pending) -->
      <div id="cancel-order-action-wrapper" class="pt-3 border-t border-white/10 flex justify-between items-center">
        <span class="text-xs text-white/50">Need to make changes? You can cancel while pending.</span>
        <button onclick="cancelActiveOrder()" class="bg-red-500/20 hover:bg-red-500 text-red-200 hover:text-white border border-red-500/40 text-xs font-bold px-4 py-2 rounded-xl transition">
          ✕ Cancel Order
        </button>
      </div>
    </div>
  </section>

  <!-- Category Filter Bar -->
  <section class="max-w-4xl mx-auto px-4 mt-6">
    <div id="category-filters" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterCategory('All')" class="category-btn bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition shadow">All Items</button>
      <button onclick="filterCategory('Pancakes & Waffles')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Pancakes & Waffles</button>
      <button onclick="filterCategory('Rice Meals')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Rice Meals</button>
      <button onclick="filterCategory('Pasta')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Pasta</button>
      <button onclick="filterCategory('Snacks')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Snacks</button>
      <button onclick="filterCategory('Pizza')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Pizza</button>
      <button onclick="filterCategory('Espresso Drinks')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Espresso</button>
      <button onclick="filterCategory('Non-Coffee')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Non-Coffee</button>
      <button onclick="filterCategory('Soda & Refreshers')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Sodas</button>
      <button onclick="filterCategory('Local Craft Beer')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Craft Beer</button>
      <button onclick="filterCategory('Add-ons')" class="category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400">Add-ons</button>
    </div>
  </section>

  <!-- Menu Section -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div id="menu-container" class="space-y-8"></div>
  </main>

  <!-- Order Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-forest border border-white/20 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold font-heading text-amber-300">Your Cart</h3>
        <button onclick="toggleCartModal()" class="text-white/60 hover:text-white text-2xl">&times;</button>
      </div>

      <div id="cart-items-list" class="space-y-3 mb-6 divide-y divide-white/10"></div>

      <form id="checkout-form" onsubmit="handlePlaceOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-amber-200/80 mb-1">FULFILLMENT OPTION *</label>
          <select id="order-type-select" onchange="updateFulfillmentFields()" class="w-full bg-dark-forest border border-white/20 rounded-xl p-3 text-sm text-cream font-bold focus:outline-none focus:border-amber-400">
            <option value="dine-in">Dine-In</option>
            <option value="take-out">Take-Out</option>
            <option value="delivery">Delivery</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-amber-200/80 mb-1">YOUR NAME *</label>
            <input type="text" id="cust-name" required placeholder="Juan Dela Cruz" class="w-full bg-dark-forest border border-white/20 rounded-xl p-3 text-sm text-cream focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-amber-200/80 mb-1">CONTACT NO. *</label>
            <input type="tel" id="cust-contact" required placeholder="0917XXXXXXX" class="w-full bg-dark-forest border border-white/20 rounded-xl p-3 text-sm text-cream focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div id="field-dine-in">
          <label class="block text-xs font-bold text-amber-200/80 mb-1">TABLE NUMBER *</label>
          <input type="text" id="cust-table" placeholder="e.g. Table 4" class="w-full bg-dark-forest border border-white/20 rounded-xl p-3 text-sm text-cream focus:outline-none focus:border-amber-400">
        </div>

        <div id="field-take-out" class="hidden">
          <label class="block text-xs font-bold text-amber-200/80 mb-1">CLAIM NUMBER</label>
          <input type="text" id="cust-claim" readonly class="w-full bg-dark-forest/50 border border-white/10 rounded-xl p-3 text-sm text-amber-300 font-mono font-bold">
        </div>

        <div id="field-delivery" class="hidden">
          <label class="block text-xs font-bold text-amber-200/80 mb-1">DELIVERY ADDRESS *</label>
          <textarea id="cust-address" rows="2" placeholder="Full street address in Baler..." class="w-full bg-dark-forest border border-white/20 rounded-xl p-3 text-sm text-cream focus:outline-none focus:border-amber-400"></textarea>
        </div>

        <div class="pt-4 border-t border-white/10 flex justify-between items-center">
          <div>
            <span class="text-xs text-white/60 block">Total Amount</span>
            <span id="cart-total" class="text-2xl font-bold font-heading text-amber-400">₱0</span>
          </div>
          <button type="submit" id="submit-order-btn" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl transition shadow-lg">
            Place Order
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ovnrgbqbfpebqjparxyq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LY5jsImbX5WCF8ZoWwXXPA_xWTRjQqj";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let menuItems = [];
    let currentCategoryFilter = 'All';
    let cart = [];
    let activeOrder = null;
    let storeStatus = 'accepting';

    async function fetchMenuItems() {
      try {
        const { data, error } = await supabaseClient.from('menu_items').select('*').order('id');
        if (!error && data && data.length > 0) {
          menuItems = data;
        }
      } catch (err) {}
      renderMenu();
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.textContent.includes(cat) || (cat === 'All' && btn.textContent.includes('All Items'))) {
          btn.className = "category-btn bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition shadow";
        } else {
          btn.className = "category-btn bg-forest border border-white/10 text-cream font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition hover:border-amber-400";
        }
      });
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      if (!container) return;

      const filtered = currentCategoryFilter === 'All' 
        ? menuItems 
        : menuItems.filter(i => i.category === currentCategoryFilter);

      const grouped = {};
      filtered.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      if (Object.keys(grouped).length === 0) {
        container.innerHTML = `<div class="text-center text-white/40 py-12">No menu items found in this category.</div>`;
        return;
      }

      const canOrder = (storeStatus === 'accepting' || storeStatus === 'OPEN');

      container.innerHTML = Object.keys(grouped).map(cat => `
        <div>
          <h3 class="text-xl font-bold font-heading text-amber-300 mb-4 border-b border-white/10 pb-2">${cat}</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${grouped[cat].map(item => `
              <div class="bg-forest border border-white/10 rounded-2xl p-4 flex justify-between items-center ${(!item.is_available || !canOrder) ? 'opacity-50' : 'hover:border-amber-500/40'} transition shadow-md">
                <div>
                  <h4 class="font-bold text-base text-cream">${item.name}</h4>
                  <p class="text-xs text-white/60 mt-1 pr-2">${item.description || ''}</p>
                  <span class="text-amber-300 font-bold font-heading text-lg block mt-2">₱${item.price}</span>
                </div>
                ${(item.is_available !== false && canOrder) ? `
                  <button onclick="addToCart(${item.id})" class="bg-white/10 hover:bg-amber-500 hover:text-black font-bold p-3 rounded-xl transition text-sm">
                    + Add
                  </button>
                ` : `
                  <span class="bg-red-500/20 text-red-300 font-bold text-xs px-3 py-1.5 rounded-lg">${!canOrder ? 'Store Offline' : 'Out of Stock'}</span>
                `}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      if (storeStatus !== 'accepting' && storeStatus !== 'OPEN') {
        alert('Store is currently not accepting orders or closed.');
        return;
      }
      const item = menuItems.find(m => m.id === id);
      if (!item || item.is_available === false) return;
      const existing = cart.find(c => c.id === id);
      if (existing) { existing.qty += 1; }
      else { cart.push({ ...item, qty: 1 }); }
      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById('cart-badge');
      const totalQty = cart.reduce((acc, i) => acc + i.qty, 0);
      badge.textContent = totalQty;
      badge.classList.toggle('hidden', totalQty === 0);

      const itemsList = document.getElementById('cart-items-list');
      itemsList.innerHTML = cart.map(i => `
        <div class="flex justify-between items-center pt-2">
          <div>
            <h4 class="font-bold text-sm text-cream">${i.name}</h4>
            <span class="text-xs text-amber-300">₱${i.price} x ${i.qty}</span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${i.id}, -1)" class="w-7 h-7 bg-white/10 rounded-lg font-bold text-xs">-</button>
            <span class="text-sm font-bold">${i.qty}</span>
            <button onclick="changeQty(${i.id}, 1)" class="w-7 h-7 bg-white/10 rounded-lg font-bold text-xs">+</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      document.getElementById('cart-total').textContent = `₱${total}`;
    }

    function changeQty(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx !== -1) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
      }
      updateCartUI();
    }

    function toggleCartModal() {
      if (storeStatus !== 'accepting' && storeStatus !== 'OPEN') {
        alert('Store is currently not accepting orders or closed.');
        return;
      }
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function updateFulfillmentFields() {
      const type = document.getElementById('order-type-select').value;
      document.getElementById('field-dine-in').classList.toggle('hidden', type !== 'dine-in');
      document.getElementById('field-take-out').classList.toggle('hidden', type !== 'take-out');
      document.getElementById('field-delivery').classList.toggle('hidden', type !== 'delivery');

      if (type === 'take-out') {
        document.getElementById('cust-claim').value = 'CLAIM-' + Math.floor(1000 + Math.random() * 9000);
      }
    }

    async function handlePlaceOrder(e) {
      e.preventDefault();
      if (storeStatus !== 'accepting' && storeStatus !== 'OPEN') {
        alert('Store is not accepting orders right now.');
        return;
      }
      if (cart.length === 0) return alert('Your cart is empty!');

      const type = document.getElementById('order-type-select').value;
      const name = document.getElementById('cust-name').value;
      const contact = document.getElementById('cust-contact').value;
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

      let table_number = null, claim_number = null, address = null;
      if (type === 'dine-in') table_number = document.getElementById('cust-table').value;
      if (type === 'take-out') claim_number = document.getElementById('cust-claim').value;
      if (type === 'delivery') address = document.getElementById('cust-address').value;

      const orderData = {
        ref_id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
        customer_name: name,
        contact_number: contact,
        order_type: type,
        table_number,
        claim_number,
        address,
        items: cart,
        total_amount: total,
        status: 'Pending'
      };

      const { data, error } = await supabaseClient
        .from('orders')
        .insert([orderData])
        .select()
        .single();

      if (error) {
        alert('Failed to place order: ' + error.message);
        return;
      }

      activeOrder = data;
      cart = [];
      updateCartUI();
      toggleCartModal();
      renderActiveTracker();
    }

    async function cancelActiveOrder() {
      if (!activeOrder) return;
      if (!confirm("Are you sure you want to cancel this order?")) return;

      try {
        await supabaseClient
          .from('orders')
          .update({ status: 'Cancelled', updated_at: new Date() })
          .eq('id', activeOrder.id);
        
        activeOrder.status = 'Cancelled';
        updateTrackerVisuals('Cancelled');
        alert("Your order has been cancelled.");
      } catch (err) {
        alert("Failed to cancel order.");
      }
    }

    function renderActiveTracker() {
      if (!activeOrder) return;
      document.getElementById('active-order-section').classList.remove('hidden');
      document.getElementById('track-order-id').textContent = activeOrder.ref_id || activeOrder.id.slice(0, 8);
      
      let detailStr = `${activeOrder.customer_name} • ${activeOrder.contact_number}`;
      if (activeOrder.order_type === 'dine-in') detailStr += ` • Table ${activeOrder.table_number}`;
      if (activeOrder.order_type === 'take-out') detailStr += ` • ${activeOrder.claim_number}`;
      if (activeOrder.order_type === 'delivery') detailStr += ` • ${activeOrder.address}`;
      document.getElementById('track-customer-details').textContent = detailStr;

      const step3Label = document.getElementById('step-3-label');
      if (activeOrder.order_type === 'dine-in') step3Label.textContent = "Ready to Serve";
      if (activeOrder.order_type === 'take-out') step3Label.textContent = "Ready to Claim";
      if (activeOrder.order_type === 'delivery') step3Label.textContent = "Ready to Deliver";

      updateTrackerVisuals(activeOrder.status);
    }

    function updateTrackerVisuals(status) {
      document.getElementById('track-status-badge').textContent = status === 'Pending' ? 'Waiting for Acceptance' : status;
      const progressLine = document.getElementById('track-line-progress');
      const c1 = document.getElementById('step-1-circle');
      const c2 = document.getElementById('step-2-circle');
      const c3 = document.getElementById('step-3-circle');
      const step1Label = document.getElementById('step-1-label');
      const cancelWrapper = document.getElementById('cancel-order-action-wrapper');
      const stepperContainer = document.getElementById('tracker-stepper-container');

      if (status === 'Cancelled') {
        document.getElementById('track-status-badge').className = "px-3.5 py-1.5 rounded-full text-xs font-bold bg-red-500 text-white tracking-wide shadow-sm";
        if(cancelWrapper) cancelWrapper.classList.add('hidden');
        if(stepperContainer) stepperContainer.classList.add('opacity-40');
        return;
      }

      if(cancelWrapper) {
        if (status === 'Pending') {
          cancelWrapper.classList.remove('hidden');
        } else {
          cancelWrapper.classList.add('hidden');
        }
      }

      if(stepperContainer) stepperContainer.classList.remove('opacity-40');

      if (status === 'Pending') {
        progressLine.style.width = '0%';
        c1.className = "w-8 h-8 rounded-full bg-amber-500 text-black font-bold flex items-center justify-center text-xs animate-pulse";
        step1Label.textContent = "Waiting for Kitchen to Accept";
        c2.className = "w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs";
        c3.className = "w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs";
      } else if (status === 'Accepted') {
        progressLine.style.width = '25%';
        c1.className = "w-8 h-8 rounded-full bg-emerald-500 text-black font-bold flex items-center justify-center text-xs";
        step1Label.textContent = "Accepted by Kitchen";
        c2.className = "w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs";
        c3.className = "w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs";
      } else if (status === 'Preparing') {
        progressLine.style.width = '60%';
        c1.className = "w-8 h-8 rounded-full bg-emerald-500 text-black font-bold flex items-center justify-center text-xs";
        step1Label.textContent = "Accepted by Kitchen";
        c2.className = "w-8 h-8 rounded-full bg-amber-500 text-black font-bold flex items-center justify-center text-xs";
        c3.className = "w-8 h-8 rounded-full bg-white/10 text-white/40 font-bold flex items-center justify-center text-xs";
      } else if (status.startsWith('Ready') || status === 'Completed') {
        progressLine.style.width = '100%';
        c1.className = "w-8 h-8 rounded-full bg-emerald-500 text-black font-bold flex items-center justify-center text-xs";
        step1Label.textContent = "Accepted";
        c2.className = "w-8 h-8 rounded-full bg-amber-500 text-black font-bold flex items-center justify-center text-xs";
        c3.className = "w-8 h-8 rounded-full bg-emerald-500 text-black font-bold flex items-center justify-center text-xs";
      }
    }

    async function pollActiveOrder() {
      if (!activeOrder) return;
      try {
        const { data } = await supabaseClient.from('orders').select('*').eq('id', activeOrder.id).single();
        if (data) {
          activeOrder = data;
          updateTrackerVisuals(data.status);
        }
      } catch (err) {}
    }

    async function fetchStoreStatus() {
      try {
        const { data } = await supabaseClient.from('store_settings').select('*').eq('id', 1).single();
        if (data) {
          storeStatus = data.store_status;
          updateStoreStatusUI(storeStatus);
        }
      } catch (err) {}
    }

    function updateStoreStatusUI(status) {
      const ind = document.getElementById('store-status-indicator');
      const text = document.getElementById('store-status-text');
      const btn = document.getElementById('submit-order-btn');
      const cartBtn = document.getElementById('cart-nav-btn');

      if (status === 'accepting' || status === 'OPEN') {
        ind.className = "w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse";
        text.textContent = "Accepting Orders Now";
        if(cartBtn) cartBtn.style.opacity = "1";
        if(btn) {
          btn.disabled = false;
          btn.className = "bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl transition shadow-lg";
        }
      } else if (status === 'not_accepting') {
        ind.className = "w-3.5 h-3.5 rounded-full bg-amber-500";
        text.textContent = "Not Accepting Orders Yet";
        if(cartBtn) cartBtn.style.opacity = "0.5";
        if(btn) {
          btn.disabled = true;
          btn.className = "bg-white/10 text-white/40 cursor-not-allowed font-bold px-6 py-3 rounded-xl";
        }
      } else {
        ind.className = "w-3.5 h-3.5 rounded-full bg-red-500";
        text.textContent = "Store Closed";
        if(cartBtn) cartBtn.style.opacity = "0.5";
        if(btn) {
          btn.disabled = true;
          btn.className = "bg-white/10 text-white/40 cursor-not-allowed font-bold px-6 py-3 rounded-xl";
        }
      }
      renderMenu();
    }

    renderMenu();
    fetchMenuItems();
    fetchStoreStatus();
    updateFulfillmentFields();

    setInterval(() => {
      fetchMenuItems();
      fetchStoreStatus();
      pollActiveOrder();
    }, 3000);
  </script>
</body>
</html>
