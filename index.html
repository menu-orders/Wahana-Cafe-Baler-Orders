<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wahana Cabin + Cafe | Online Ordering</title>
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { dark: '#1B3B2B', accent: '#2D5A40', beige: '#F4EFE6', gold: '#D4A359' }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] }
        }
      }
    }
  </script>
  <style>
    .hp-field { display: none !important; }
    body { background-color: #F4EFE6; color: #1B3B2B; }
  </style>
</head>
<body class="min-h-screen font-sans pb-24">

  <header class="bg-brand-dark text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center p-1 border-2 border-brand-gold">
          <svg viewBox="0 0 100 100" class="w-full h-full text-brand-dark fill-current">
            <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-weight="900" font-size="22" font-family="serif">WAHANA</text>
            <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-size="10" letter-spacing="1">BALER</text>
          </svg>
        </div>
        <div>
          <h1 class="font-serif text-xl font-bold tracking-wide">Wahana Cabin + Cafe</h1>
          <p class="text-xs text-brand-gold">Baler, Aurora • Est. 2023</p>
        </div>
      </div>
      <div id="shopStatusBanner" class="px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 bg-emerald-800 text-emerald-100">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="shopStatusText">Accepting Orders</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-8">
    <section class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-brand-dark/10">
      <h2 class="text-lg font-bold mb-2 text-brand-dark">🔍 Track Your Active Order</h2>
      <div class="flex gap-2">
        <input type="text" id="trackInput" placeholder="Enter Ref (e.g., WAH-8392)" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-300 uppercase font-mono text-sm">
        <button type="button" onclick="trackOrder()" class="bg-brand-dark text-white px-5 py-2.5 rounded-xl font-semibold">Track</button>
      </div>
      <div id="trackerResult" class="hidden mt-4 p-4 rounded-xl bg-brand-beige border border-brand-gold/30">
        <span id="trackRef" class="font-mono font-bold text-lg text-brand-dark"></span>
        <p id="trackCustomer" class="text-xs text-gray-600"></p>
        <span id="trackBadge" class="inline-block mt-2 px-3 py-1 rounded-full text-xs font-bold uppercase"></span>
      </div>
    </section>

    <section>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
        <h2 class="font-serif text-2xl font-bold text-brand-dark">Our Menu</h2>
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-2"></div>
      </div>
      <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <section class="bg-white p-6 rounded-2xl shadow-md border border-brand-dark/10 space-y-6">
      <h2 class="font-serif text-2xl font-bold text-brand-dark border-b pb-3">Complete Your Order</h2>
      <div>
        <h3 class="text-sm font-bold uppercase tracking-wider text-gray-500 mb-3">Selected Items</h3>
        <div id="cartItemsList" class="divide-y divide-gray-100 mb-3"><p class="text-sm text-gray-400 italic py-2">No items added yet.</p></div>
        <div class="flex justify-between items-center text-lg font-bold text-brand-dark pt-3 border-t">
          <span>Total Amount:</span><span>₱<span id="cartTotal">0.00</span></span>
        </div>
      </div>

      <form id="orderForm" onsubmit="handleOrderSubmit(event)" class="space-y-4 pt-4 border-t">
        <input type="text" name="website_url" class="hp-field" tabindex="-1" autocomplete="off">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name *</label><input type="text" id="custName" required placeholder="Juan Cruz" class="w-full px-4 py-2.5 rounded-xl border text-sm"></div>
          <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contact Number (PH) *</label><input type="tel" id="custPhone" required placeholder="09171234567" class="w-full px-4 py-2.5 rounded-xl border text-sm"></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Order Mode *</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="border rounded-xl p-3 text-center cursor-pointer text-sm font-semibold"><input type="radio" name="orderType" value="dine_in" checked onclick="toggleOrderTypeFields()" class="mr-1"> Dine-In</label>
            <label class="border rounded-xl p-3 text-center cursor-pointer text-sm font-semibold"><input type="radio" name="orderType" value="takeout" onclick="toggleOrderTypeFields()" class="mr-1"> Takeout</label>
            <label class="border rounded-xl p-3 text-center cursor-pointer text-sm font-semibold"><input type="radio" name="orderType" value="delivery" onclick="toggleOrderTypeFields()" class="mr-1"> Delivery</label>
          </div>
        </div>
        <div id="dineInFields" class="p-4 bg-brand-beige rounded-xl border"><label class="block text-xs font-bold uppercase mb-1">Table Number *</label><input type="number" id="tableNum" placeholder="Table 4" class="w-full px-4 py-2 rounded-xl border text-sm"></div>
        <div id="takeoutFields" class="hidden p-4 bg-brand-beige rounded-xl border"><label class="block text-xs font-bold uppercase mb-1">Claim Reference</label><input type="text" id="takeoutClaim" readonly class="w-full px-4 py-2 rounded-xl border font-mono font-bold bg-gray-100 text-sm"></div>
        <div id="deliveryFields" class="hidden p-4 bg-brand-beige rounded-xl border"><label class="block text-xs font-bold uppercase mb-1">Delivery Address *</label><textarea id="deliveryAddress" rows="2" placeholder="Street, Barangay, Baler" class="w-full px-4 py-2 rounded-xl border text-sm"></textarea></div>
        <button type="submit" id="submitBtn" class="w-full bg-brand-dark text-white py-3.5 rounded-xl font-bold hover:bg-brand-accent transition-all">Submit Order</button>
      </form>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://ovnrgbqbfpebqjparxyq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_LY5jsImbX5WCF8ZoWwXXPA_xWTRjQqj";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Complete menu fallback so items display immediately even on mobile file inspection
    let menuItems = [
      { id: '1', category: 'Espresso Drinks', name: 'Americano', description: 'Double shot espresso, water', price: 100.00, is_available: true, display_order: 1 },
      { id: '2', category: 'Espresso Drinks', name: 'Latte', description: 'Double shot espresso, full cream milk', price: 120.00, is_available: true, display_order: 2 },
      { id: '3', category: 'Espresso Drinks', name: 'Caramel Macchiato', description: 'Double shot espresso, milk, vanilla, caramel', price: 140.00, is_available: true, display_order: 3 },
      { id: '4', category: 'Espresso Drinks', name: 'Hazelnut Mocha', description: 'Double shot espresso, milk, hazelnut, chocolate', price: 140.00, is_available: true, display_order: 4 },
      { id: '5', category: 'Espresso Drinks', name: 'Matcha Espresso Fusion', description: 'Double shot espresso, milk, pure matcha', price: 140.00, is_available: true, display_order: 5 },
      { id: '6', category: 'Espresso Drinks', name: 'Spanish Latte', description: 'Espresso, milk, condensed milk', price: 150.00, is_available: true, display_order: 6 },
      { id: '7', category: 'Brewed Coffee', name: 'Drip Coffee', description: 'Medium roast coffee, just black', price: 80.00, is_available: true, display_order: 7 },
      { id: '8', category: 'Non-Coffee', name: 'Signature Chocolate', description: 'Dark chocolate sauce, full cream milk', price: 140.00, is_available: true, display_order: 8 },
      { id: '9', category: 'Non-Coffee', name: 'Matcha Latte', description: 'Ceremonial matcha, full cream milk', price: 140.00, is_available: true, display_order: 9 },
      { id: '10', category: 'Non-Coffee', name: 'Strawberry Milk', description: 'Strawberry puree, full cream milk', price: 150.00, is_available: true, display_order: 10 },
      { id: '11', category: 'Pancakes & Waffles', name: 'Maple & Butter Pancake', description: 'Two-piece pancake, maple syrup, butter', price: 80.00, is_available: true, display_order: 11 },
      { id: '12', category: 'Pancakes & Waffles', name: 'Chocolate Chip Pancake', description: 'Two-piece pancake with chocolate chips, whipped cream', price: 110.00, is_available: true, display_order: 12 },
      { id: '13', category: 'Rice Meals', name: 'Garlic Longganisa', description: 'Two-piece homemade garlic longganisa, egg, fried rice', price: 120.00, is_available: true, display_order: 13 },
      { id: '14', category: 'Rice Meals', name: 'Bistek Tagalog', description: 'Beef sirloin, scrambled egg, fried rice', price: 140.00, is_available: true, display_order: 14 },
      { id: '15', category: 'Pasta & Pizza', name: 'Creamy Tuna Pesto', description: 'Thick white sauce, basil pesto, tuna, linguine', price: 150.00, is_available: true, display_order: 15 },
      { id: '16', category: 'Pasta & Pizza', name: 'Mushroom Truffle Pasta', description: 'White sauce, black truffle, mushroom, linguine', price: 160.00, is_available: true, display_order: 16 },
      { id: '17', category: 'Pasta & Pizza', name: 'Pizza Margherita', description: 'Neapolitan Style Pizza (8-9")', price: 250.00, is_available: true, display_order: 17 },
      { id: '18', category: 'Pasta & Pizza', name: 'Pepperoni Pizza', description: 'Neapolitan Style Pizza (8-9")', price: 300.00, is_available: true, display_order: 18 }
    ];
    let cart = {}, activeCategory = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderMenu();
      generateTakeoutClaim();
      syncWithSupabase();
    });

    function generateTakeoutClaim() {
      document.getElementById('takeoutClaim').value = 'TAKEOUT-' + Math.floor(1000 + Math.random() * 9000);
    }

    function toggleOrderTypeFields() {
      const mode = document.querySelector('input[name="orderType"]:checked').value;
      document.getElementById('dineInFields').classList.toggle('hidden', mode !== 'dine_in');
      document.getElementById('takeoutFields').classList.toggle('hidden', mode !== 'takeout');
      document.getElementById('deliveryFields').classList.toggle('hidden', mode !== 'delivery');
      if (mode === 'takeout') generateTakeoutClaim();
    }

    function renderCategories() {
      const categories = ['ALL', ...new Set(menuItems.map(i => i.category))];
      document.getElementById('categoryTabs').innerHTML = categories.map(cat => `
        <button type="button" onclick="filterCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-semibold shrink-0 ${cat === activeCategory ? 'bg-brand-dark text-white' : 'bg-white text-brand-dark border'}">${cat}</button>
      `).join('');
    }

    function filterCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const filtered = activeCategory === 'ALL' ? menuItems : menuItems.filter(i => i.category === activeCategory);
      document.getElementById('menuContainer').innerHTML = filtered.map(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        return `
          <div class="bg-white p-4 rounded-xl border shadow-sm flex flex-col justify-between ${!item.is_available ? 'opacity-50' : ''}">
            <div>
              <div class="flex justify-between items-start">
                <h3 class="font-bold text-brand-dark">${item.name}</h3>
                <span class="font-bold text-brand-dark">₱${parseFloat(item.price).toFixed(2)}</span>
              </div>
              <p class="text-xs text-gray-500 mt-1">${item.description}</p>
            </div>
            <div class="mt-4 flex justify-between items-center">
              <span class="text-xs font-semibold ${item.is_available ? 'text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded' : 'text-rose-600 bg-rose-50 px-2 py-0.5 rounded'}">${item.is_available ? 'Available' : 'Sold Out'}</span>
              ${item.is_available ? `
                <div class="flex items-center space-x-2 bg-brand-beige rounded-lg px-2 py-1 border">
                  <button type="button" onclick="updateCart('${item.id}', -1)" class="w-6 h-6 font-bold hover:bg-gray-200 rounded">-</button>
                  <span class="text-sm font-bold w-4 text-center">${qty}</span>
                  <button type="button" onclick="updateCart('${item.id}', 1)" class="w-6 h-6 font-bold hover:bg-gray-200 rounded">+</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateCart(itemId, delta) {
      const item = menuItems.find(i => i.id === itemId);
      if (!item) return;
      if (!cart[itemId]) {
        if (delta > 0) cart[itemId] = { item, qty: delta };
      } else {
        cart[itemId].qty += delta;
        if (cart[itemId].qty <= 0) delete cart[itemId];
      }
      renderMenu();
      renderCart();
    }

    function renderCart() {
      const keys = Object.keys(cart);
      const container = document.getElementById('cartItemsList');
      if (keys.length === 0) {
        container.innerHTML = `<p class="text-sm text-gray-400 italic py-2">No items added yet.</p>`;
        document.getElementById('cartTotal').innerText = '0.00';
        return;
      }
      let total = 0;
      container.innerHTML = keys.map(id => {
        const entry = cart[id];
        const itemTotal = entry.item.price * entry.qty;
        total += itemTotal;
        return `<div class="flex justify-between items-center py-2 text-sm"><span>${entry.item.name} (x${entry.qty})</span><span class="font-semibold">₱${itemTotal.toFixed(2)}</span></div>`;
      }).join('');
      document.getElementById('cartTotal').innerText = total.toFixed(2);
    }

    async function handleOrderSubmit(e) {
      e.preventDefault();
      if (document.querySelector('input[name="website_url"]').value !== "") return;
      const keys = Object.keys(cart);
      if (keys.length === 0) { alert("Please select items first."); return; }
      
      const phone = document.getElementById('custPhone').value.trim();
      if (!/^(09|\+639)\d{9}$/.test(phone)) { alert("Enter valid PH phone number (e.g. 09171234567)"); return; }

      const orderType = document.querySelector('input[name="orderType"]:checked').value;
      const typeDetails = orderType === 'dine_in' ? { table_number: document.getElementById('tableNum').value } :
                          orderType === 'takeout' ? { claim_number: document.getElementById('takeoutClaim').value } :
                          { delivery_address: document.getElementById('deliveryAddress').value };

      if (orderType === 'dine_in' && !typeDetails.table_number) { alert("Please specify table number."); return; }

      const orderRef = 'WAH-' + Math.floor(1000 + Math.random() * 9000);
      const payload = {
        order_ref: orderRef,
        customer_name: document.getElementById('custName').value.trim(),
        contact_number: phone,
        order_type: orderType,
        type_details: typeDetails,
        items: keys.map(id => ({ id: cart[id].item.id, name: cart[id].item.name, price: cart[id].item.price, quantity: cart[id].qty })),
        total_amount: parseFloat(document.getElementById('cartTotal').innerText),
        status: 'Pending'
      };

      const { error } = await supabase.from('orders').insert([payload]);
      if (error) {
        alert("Order submission error: " + error.message);
      } else {
        alert(`Order Placed Successfully! Reference: ${orderRef}`);
        cart = {}; renderCart(); renderMenu();
        document.getElementById('orderForm').reset();
        generateTakeoutClaim();
        document.getElementById('trackInput').value = orderRef;
        trackOrder();
      }
    }

    async function trackOrder() {
      const ref = document.getElementById('trackInput').value.trim().toUpperCase();
      if (!ref) return;
      const { data } = await supabase.from('orders').select('*').eq('order_ref', ref).single();
      const res = document.getElementById('trackerResult');
      if (data) {
        res.classList.remove('hidden');
        document.getElementById('trackRef').innerText = data.order_ref;
        document.getElementById('trackCustomer').innerText = `Customer: ${data.customer_name}`;
        const badge = document.getElementById('trackBadge');
        badge.innerText = data.status;
        badge.className = "inline-block mt-2 px-3 py-1 rounded-full text-xs font-bold uppercase bg-blue-100 text-blue-800";
      } else {
        alert("Order reference not found.");
      }
    }

    async function syncWithSupabase() {
      try {
        const { data: menu } = await supabase.from('menu_items').select('*').order('display_order', { ascending: true });
        if (menu && menu.length > 0) { menuItems = menu; renderCategories(); renderMenu(); }
        const { data: shop } = await supabase.from('shop_settings').select('status').eq('id', 1).single();
        if (shop) {
          document.getElementById('shopStatusText').innerText = shop.status === 'accepting' ? 'Accepting Orders' : 'Paused / Closed';
        }
      } catch (err) { console.log('Using local fallback menu'); }
    }
  </script>
</body>
</html>
